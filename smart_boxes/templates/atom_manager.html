<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atom Manager - LIS SBBS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .btn-primary { transition: all 0.3s; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(6, 182, 212, 0.3); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .tab-active { background: linear-gradient(to right, #06b6d4, #3b82f6); color: white; }
        .notification { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .graph-node { cursor: pointer; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold mb-2 bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">Atom Manager</h1>
            <p class="text-gray-400">Nhập nội dung → Phân rã thành Nguyên tử → Lưu trữ & Hiển thị</p>
        </div>

        <div class="flex gap-4 mb-6 justify-center flex-wrap">
            <button onclick="showTab('input')" id="tab-input" class="tab-active px-6 py-3 rounded-lg font-semibold transition">📝 Nhập nội dung</button>
            <button onclick="showTab('list')" id="tab-list" class="px-6 py-3 bg-gray-700 rounded-lg font-semibold hover:bg-gray-600 transition"> Danh sách Nguyên tử</button>
            <button onclick="showTab('graph')" id="tab-graph" class="px-6 py-3 bg-gray-700 rounded-lg font-semibold hover:bg-gray-600 transition">🕸️ Knowledge Graph</button>
        </div>

        <div id="content-input" class="bg-gray-800 rounded-xl p-6 shadow-lg border border-gray-700">
            <div class="mb-6">
                <label class="block text-cyan-400 font-semibold mb-2">📌 Tiêu đề tài liệu</label>
                <input type="text" id="docTitle" placeholder="Ví dụ: Hạ tầng Niềm tin và AI Agent" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 text-white">
            </div>
            <div class="mb-6">
                <label class="block text-cyan-400 font-semibold mb-2">📄 Hoặc dán nội dung văn bản</label>
                <textarea id="textContent" rows="10" placeholder="Dán nội dung văn bản của bạn vào đây..." class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 text-white resize-y"></textarea>
            </div>
            <div class="border-t border-gray-700 pt-6 mb-6">
                <label class="block text-cyan-400 font-semibold mb-2">📁 Hoặc tải file lên (.txt, .pdf, .docx)</label>
                <input type="file" id="fileInput" accept=".txt,.pdf,.docx" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 text-white">
                <p class="text-gray-400 text-sm mt-2">Hỗ trợ: TXT, PDF, DOCX</p>
            </div>
            <button onclick="parseContent()" id="parseBtn" class="btn-primary px-8 py-4 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-lg font-bold text-lg"> Phân rã thành Nguyên tử</button>
            <div id="resultArea" class="mt-6"></div>
        </div>

        <div id="content-list" class="hidden bg-gray-800 rounded-xl p-6 shadow-lg border border-gray-700">
            <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
                <h2 class="text-2xl font-bold text-cyan-400">Danh sách Knowledge Atoms</h2>
                <div class="flex gap-2">
                    <input type="text" id="searchInput" placeholder="Tìm kiếm atoms..." class="px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 text-white" oninput="filterAtoms()">
                    <button onclick="loadAtoms()" class="px-4 py-2 bg-cyan-600 rounded-lg hover:bg-cyan-700 transition">🔄 Refresh</button>
                </div>
            </div>
            <div id="atomsList" class="space-y-3 max-h-[600px] overflow-y-auto pr-2"></div>
        </div>

        <div id="content-graph" class="hidden bg-gray-800 rounded-xl p-6 shadow-lg border border-gray-700">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-cyan-400">Knowledge Graph</h2>
                <button onclick="loadGraph()" class="px-4 py-2 bg-cyan-600 rounded-lg hover:bg-cyan-700 transition">🔄 Refresh</button>
            </div>
            <div id="graphContainer" class="h-[600px] bg-gray-900 rounded-lg border-2 border-gray-700 relative overflow-hidden"></div>
            <div class="mt-3 flex flex-wrap gap-4 text-xs">
                <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-green-500"></div><span class="text-gray-300">Beginner</span></div>
                <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-yellow-500"></div><span class="text-gray-300">Intermediate</span></div>
                <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-red-500"></div><span class="text-gray-300">Advanced</span></div>
                <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-gray-400"></div><span class="text-gray-300">Not Analyzed</span></div>
            </div>
        </div>
    </div>

    <div id="notificationContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script>
        let atoms = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            loadAtoms();
        });

        function showTab(tabName) {
            document.getElementById('content-input').classList.add('hidden');
            document.getElementById('content-list').classList.add('hidden');
            document.getElementById('content-graph').classList.add('hidden');
            
            ['input', 'list', 'graph'].forEach(function(t) {
                document.getElementById('tab-' + t).className = 'px-6 py-3 bg-gray-700 rounded-lg font-semibold hover:bg-gray-600 transition';
            });
            
            document.getElementById('content-' + tabName).classList.remove('hidden');
            document.getElementById('tab-' + tabName).className = 'tab-active px-6 py-3 rounded-lg font-semibold transition';
            
            if (tabName === 'list') loadAtoms();
            else if (tabName === 'graph') setTimeout(loadGraph, 100);
        }

        async function parseContent() {
            var title = document.getElementById('docTitle').value.trim();
            var content = document.getElementById('textContent').value.trim();
            var fileInput = document.getElementById('fileInput');
            var file = fileInput.files[0];
            var btn = document.getElementById('parseBtn');
            var resultArea = document.getElementById('resultArea');
            
            if (!title && !content && !file) {
                showNotification('Vui lòng nhập tiêu đề, nội dung hoặc chọn file!', 'error');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = ' Đang phân tích...';
            resultArea.innerHTML = '';
            
            try {
                var response;
                if (file) {
                    var formData = new FormData();
                    formData.append('file', file);
                    response = await fetch('/api/atoms/parse-file', { method: 'POST', body: formData });
                } else {
                    var formData2 = new FormData();
                    formData2.append('text', content);
                    formData2.append('title', title || 'Untitled');
                    response = await fetch('/api/parse-text', { method: 'POST', body: formData2 });
                }
                
                var result = await response.json();
                
                if (result.status === 'success' || result.atoms_created !== undefined) {
                    var count = result.atoms_created || 0;
                    resultArea.innerHTML = '<div class="bg-green-900 border-l-4 border-green-500 p-4 rounded"><p class="text-green-300">✅ Đã tạo ' + count + ' Knowledge Atoms!</p></div>';
                    showNotification('Đã tạo ' + count + ' Knowledge Atoms!', 'success');
                    document.getElementById('docTitle').value = '';
                    document.getElementById('textContent').value = '';
                    document.getElementById('fileInput').value = '';
                } else {
                    var errorMsg = result.message || result.detail || result.error || 'Unknown error';
                    resultArea.innerHTML = '<div class="bg-red-900 border-l-4 border-red-500 p-4 rounded"><p class="text-red-300">❌ Lỗi: ' + errorMsg + '</p></div>';
                    showNotification('Lỗi: ' + errorMsg, 'error');
                }
            } catch (error) {
                resultArea.innerHTML = '<div class="bg-red-900 border-l-4 border-red-500 p-4 rounded"><p class="text-red-300">❌ Lỗi kết nối: ' + error.message + '</p></div>';
                showNotification('Lỗi kết nối: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔬 Phân rã thành Nguyên tử';
            }
        }

        async function loadAtoms() {
            try {
                var response = await fetch('/api/atoms');
                atoms = await response.json();
                renderAtoms();
            } catch (error) {
                console.error('Error loading atoms:', error);
                showNotification('Không thể tải danh sách atoms', 'error');
            }
        }

        function renderAtoms() {
            var container = document.getElementById('atomsList');
            if (atoms.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-8">📭 Không có atoms nào</div>';
                return;
            }
            
            var html = '';
            atoms.forEach(function(atom) {
                var analysis = atom.ai_analysis || {};
                var difficulty = analysis.difficulty || 'unknown';
                var colors = { 'beginner': 'border-green-500', 'intermediate': 'border-yellow-500', 'advanced': 'border-red-500', 'unknown': 'border-gray-500' };
                var atomId = atom.atom_id || atom.id;
                var title = atom.title || 'Untitled';
                var content = atom.content || '';
                var atomType = atom.atom_type || 'concept';
                
                html += '<div class="bg-gray-700 p-4 rounded-lg border-l-4 ' + colors[difficulty] + '">';
                html += '<h3 class="font-bold text-lg">' + title + '</h3>';
                html += '<p class="text-gray-300 text-sm line-clamp-2">' + content.substring(0, 150) + '...</p>';
                html += '<div class="text-xs text-gray-400 mt-2">ID: ' + atomId + ' | ' + atomType + '</div>';
                html += '</div>';
            });
            
            container.innerHTML = html;
        }

        function filterAtoms() {
            var searchTerm = document.getElementById('searchInput').value.toLowerCase();
            var filteredAtoms = atoms.filter(function(atom) {
                return (atom.title || '').toLowerCase().includes(searchTerm) || (atom.content || '').toLowerCase().includes(searchTerm);
            });
            renderAtoms();
        }

        async function loadGraph() {
            var container = document.getElementById('graphContainer');
            container.innerHTML = '<div class="flex items-center justify-center h-full"><p>⏳ Loading graph...</p></div>';
            
            try {
                var response = await fetch('/api/graph');
                var graphData = await response.json();
                
                console.log('Graph data:', graphData);
                
                if (!graphData.nodes || graphData.nodes.length === 0) {
                    container.innerHTML = '<div class="flex items-center justify-center h-full text-gray-400"><p>🕸️ Chưa có dữ liệu Knowledge Graph</p></div>';
                    return;
                }
                
                renderD3Graph(graphData);
            } catch (error) {
                console.error('Error loading graph:', error);
                container.innerHTML = '<div class="flex items-center justify-center h-full text-red-400"><p>❌ Lỗi: ' + error.message + '</p></div>';
            }
        }
function renderD3Graph(graphData) {
    var container = document.getElementById('graphContainer');
    var width = container.clientWidth || 800;
    var height = 600;
    
    container.innerHTML = '';
    
    var svg = d3.select('#graphContainer').append('svg').attr('width', '100%').attr('height', '100%').attr('viewBox', '0 0 ' + width + ' ' + height);
    
    var colors = { 'beginner': '#10B981', 'intermediate': '#F59E0B', 'advanced': '#EF4444', 'unknown': '#6B7280' };
    
    var atomMap = {};
    atoms.forEach(function(a) { atomMap[a.atom_id || a.id] = a; });
    
    var nodes = graphData.nodes.map(function(n) {
        var atom = atomMap[n.id];
        var difficulty = (atom && atom.ai_analysis && atom.ai_analysis.difficulty) || 'unknown';
        return { 
            id: n.id, 
            title: n.title || 'Atom', 
            color: colors[difficulty] || colors['unknown'], 
            difficulty: difficulty 
        };
    });
    
    var existingIds = new Set(nodes.map(function(n) { return n.id; }));
    var links = (graphData.links || []).filter(function(l) { return existingIds.has(l.source) && existingIds.has(l.target); });
    
    var simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(function(d) { return d.id; }).distance(120))
        .force('charge', d3.forceManyBody().strength(-400))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(50));
    
    // Vẽ links
    var link = svg.append('g').selectAll('line').data(links).join('line')
        .attr('stroke', '#4B5563')
        .attr('stroke-width', 2)
        .attr('stroke-opacity', 0.6);
    
    // Vẽ nodes
    var node = svg.append('g').selectAll('g').data(nodes).join('g')
        .call(d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended));
    
    node.append('circle')
        .attr('r', 25)
        .attr('fill', function(d) { return d.color; })
        .attr('stroke', '#fff')
        .attr('stroke-width', 2);
    
    // Label dài hơn
    node.append('text')
        .text(function(d) { 
            return d.title.length > 25 ? d.title.substring(0, 22) + '...' : d.title; 
        })
        .attr('x', 30)
        .attr('y', 5)
        .attr('font-size', '12px')
        .attr('fill', '#D1D5DB')
        .attr('font-weight', '500');
    
    // Tooltip
    node.append('title')
        .text(function(d) { return d.title + '\nDifficulty: ' + d.difficulty; });
    
    simulation.on('tick', function() {
        link.attr('x1', function(d) { return d.source.x; })
            .attr('y1', function(d) { return d.source.y; })
            .attr('x2', function(d) { return d.target.x; })
            .attr('y2', function(d) { return d.target.y; });
        
        node.attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; });
    });
    
    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }
    
    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
    }
    
    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
    }
}

        function showNotification(message, type) {
            var container = document.getElementById('notificationContainer');
            var notification = document.createElement('div');
            var colors = { 'success': 'bg-green-600', 'error': 'bg-red-600', 'info': 'bg-blue-600' };
            notification.className = 'notification ' + colors[type] + ' text-white px-6 py-3 rounded-lg shadow-lg';
            notification.textContent = message;
            container.appendChild(notification);
            setTimeout(function() { notification.remove(); }, 3000);
        }
    </script>
</body>
</html>
